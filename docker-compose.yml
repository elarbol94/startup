name: management-platform

services:
  app:
    build: .
    # The `proxy` service is the entry point (the app and the /office document
    # server share one origin); the app publishes no host port.
    environment:
      # Set BETTER_AUTH_SECRET in a .env file next to this compose file.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Public URL of the app (behind your reverse proxy).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://startup.elarbol.me}
      # Invitation email delivery. Use port 465 with SMTP_SECURE=true, or 587 with STARTTLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Extra trusted browser origins, for example a local development proxy.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # Internal-only endpoint; never expose LanguageTool on a host port.
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-http://languagetool:8010}
      # Optional AI-assisted calendar import; deterministic parsing remains the fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CALENDAR_MODEL: ${OPENAI_CALENDAR_MODEL:-gpt-6-astra}
      OPENAI_MINUTES_MODEL: ${OPENAI_MINUTES_MODEL:-gpt-6-astra}
      # Office documents (ONLYOFFICE). See docs/office-documents.md.
      ONLYOFFICE_INBOX_SECRET: ${ONLYOFFICE_INBOX_SECRET:-}
      ONLYOFFICE_OUTBOX_SECRET: ${ONLYOFFICE_OUTBOX_SECRET:-}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_PUBLIC_PATH: /office
      APP_INTERNAL_URL: http://app:3000
      OFFICE_DISABLED: ${OFFICE_DISABLED:-false}
    volumes:
      - app_data:/data
    restart: unless-stopped

  # Single origin: / → app, /collab → live collaboration, /office/ → ONLYOFFICE.
  # Loopback-only by default prevents bypassing Cloudflare Access through the
  # host's public IP. The Cloudflare Tunnel route is http://localhost:3007.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-3007}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - onlyoffice
    restart: unless-stopped

  # ONLYOFFICE Docs Community (AGPL, unmodified image; mobile editing is view-only).
  # Pin the tag; upgrade deliberately after running the office e2e gate.
  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    entrypoint: ["/bin/sh", "/deploy/onlyoffice-entrypoint.sh"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_INBOX_SECRET:-}
      ONLYOFFICE_INBOX_SECRET: ${ONLYOFFICE_INBOX_SECRET:-}
      ONLYOFFICE_OUTBOX_SECRET: ${ONLYOFFICE_OUTBOX_SECRET:-}
      # The app is reached on the private compose network (callbacks, file download).
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      # Only the workspace plugin is loaded; no bundled or marketplace plugins.
      PLUGINS_ENABLED: "false"
    volumes:
      - ./deploy/onlyoffice-entrypoint.sh:/deploy/onlyoffice-entrypoint.sh:ro
      # Unsaved co-editing state lives here until the save callback succeeds:
      # keep these volumes and include them in backups.
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      - onlyoffice_rabbitmq:/var/lib/rabbitmq
      - onlyoffice_redis:/var/lib/redis
      - onlyoffice_logs:/var/log/onlyoffice
    stop_grace_period: 60s
    restart: unless-stopped

  languagetool:
    image: collabora/languagetool:6.6
    restart: unless-stopped
    environment:
      langtool_languageModel: ""
      Java_Xms: 256m
      Java_Xmx: 768m

  # Opt in with: docker compose --profile cloudflare up --build -d
  # The remotely managed tunnel route is http://localhost:3007. Host network
  # mode makes that address resolve to the host from inside this container.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      # Using the environment avoids exposing the token in the process list.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  app_data:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:
  onlyoffice_rabbitmq:
  onlyoffice_redis:
  onlyoffice_logs:
