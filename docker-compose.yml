name: management-platform

services:
  app:
    build: .
    # The `proxy` service is the entry point (the app and the /office document
    # server share one origin); the app publishes no host port.
    environment:
      # Set BETTER_AUTH_SECRET in a .env file next to this compose file.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Public URL of the app (behind your reverse proxy).
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://startup.elarbol.me}
      # Invitation email delivery. Use port 465 with SMTP_SECURE=true, or 587 with STARTTLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Extra trusted browser origins, for example a local development proxy.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # Internal-only endpoint; never expose LanguageTool on a host port.
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-http://languagetool:8010}
      # Optional AI-assisted calendar import; deterministic parsing remains the fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CALENDAR_MODEL: ${OPENAI_CALENDAR_MODEL:-gpt-6-astra}
      OPENAI_MINUTES_MODEL: ${OPENAI_MINUTES_MODEL:-gpt-6-astra}
      # Meeting protocols (docs/meetings.md): transcription and protocol models.
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe-diarize}
      OPENAI_MEETINGS_MODEL: ${OPENAI_MEETINGS_MODEL:-gpt-6-astra}
      MEETINGS_MAX_UPLOAD_BYTES: ${MEETINGS_MAX_UPLOAD_BYTES:-4294967296}
      # Online calls (Compose profile "meetings"); empty keys switch calls off.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: /livekit
      LIVEKIT_EGRESS_DIR: /egress-staging
      # Office documents (ONLYOFFICE). See docs/office-documents.md.
      ONLYOFFICE_INBOX_SECRET: ${ONLYOFFICE_INBOX_SECRET:-}
      ONLYOFFICE_OUTBOX_SECRET: ${ONLYOFFICE_OUTBOX_SECRET:-}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_PUBLIC_PATH: /office
      APP_INTERNAL_URL: http://app:3000
      OFFICE_DISABLED: ${OFFICE_DISABLED:-false}
    volumes:
      - app_data:/data
      # Call recordings written by the egress service, taken into /data by the app.
      - egress_staging:/egress-staging
    restart: unless-stopped

  # Single origin: / → app, /collab → live collaboration, /office/ → ONLYOFFICE.
  # Loopback-only by default prevents bypassing Cloudflare Access through the
  # host's public IP. The Cloudflare Tunnel route is http://localhost:3007.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-3007}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - onlyoffice
    restart: unless-stopped

  # ONLYOFFICE Docs Community (AGPL, unmodified image; mobile editing is view-only).
  # Pin the tag; upgrade deliberately after running the office e2e gate.
  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    entrypoint: ["/bin/sh", "/deploy/onlyoffice-entrypoint.sh"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_INBOX_SECRET:-}
      ONLYOFFICE_INBOX_SECRET: ${ONLYOFFICE_INBOX_SECRET:-}
      ONLYOFFICE_OUTBOX_SECRET: ${ONLYOFFICE_OUTBOX_SECRET:-}
      # The app is reached on the private compose network (callbacks, file download).
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      # Only the workspace plugin is loaded; no bundled or marketplace plugins.
      PLUGINS_ENABLED: "false"
    volumes:
      - ./deploy/onlyoffice-entrypoint.sh:/deploy/onlyoffice-entrypoint.sh:ro
      # Unsaved co-editing state lives here until the save callback succeeds:
      # keep these volumes and include them in backups.
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      - onlyoffice_rabbitmq:/var/lib/rabbitmq
      - onlyoffice_redis:/var/lib/redis
      - onlyoffice_logs:/var/log/onlyoffice
    stop_grace_period: 60s
    restart: unless-stopped

  languagetool:
    image: collabora/languagetool:6.6
    restart: unless-stopped
    environment:
      langtool_languageModel: ""
      Java_Xms: 256m
      Java_Xmx: 768m

  # Online calls: opt in with --profile meetings (docs/meetings.md). Media
  # (UDP 7882 / TCP 7881) is published on the Tailscale address only, so only
  # devices in the tailnet can take part; signaling goes through the proxy.
  livekit:
    image: livekit/livekit-server:v1.13.8
    profiles: ["meetings"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:-unset}: ${LIVEKIT_API_SECRET:-unset}
        room:
          auto_create: false
          empty_timeout: 600
        webhook:
          api_key: ${LIVEKIT_API_KEY:-unset}
          urls: ["http://app:3000/api/meetings/livekit-webhook"]
        logging:
          level: info
    ports:
      - "${LIVEKIT_NODE_IP:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_NODE_IP:-127.0.0.1}:7882:7882/udp"
    depends_on:
      - redis
    restart: unless-stopped

  # Records each participant's audio track to egress_staging (no transcoding).
  egress:
    image: livekit/egress:v1.15.0
    profiles: ["meetings"]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-unset}
        api_secret: ${LIVEKIT_API_SECRET:-unset}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        log_level: info
        session_limits:
          file_output_max_duration: 4h
        cpu_cost:
          track_cpu_cost: 0.5
          room_composite_cpu_cost: 2
    volumes:
      - egress_staging:/out
    cpus: 2
    mem_limit: 2g
    depends_on:
      egress-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: unless-stopped

  # The recorder (uid 1001) writes and the app removes files in the shared volume.
  egress-init:
    image: alpine:3.20
    profiles: ["meetings"]
    command: ["chmod", "0777", "/out"]
    volumes:
      - egress_staging:/out

  redis:
    image: redis:7-alpine
    profiles: ["meetings"]
    restart: unless-stopped

  # Opt in with: docker compose --profile cloudflare up --build -d
  # The remotely managed tunnel route is http://localhost:3007. Host network
  # mode makes that address resolve to the host from inside this container.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      # Using the environment avoids exposing the token in the process list.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  app_data:
  egress_staging:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:
  onlyoffice_rabbitmq:
  onlyoffice_redis:
  onlyoffice_logs:
