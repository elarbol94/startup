# Single origin for the app and the ONLYOFFICE document
# server. See docs/office-documents.md. Cloudflare Tunnel points here.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

# Docker's resolver, so the optional livekit service is looked up per request
# and nginx still starts when the "meetings" profile is not running.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_tokens off;
  client_max_body_size 100m;

  # ONLYOFFICE on a virtual path: the document server builds its public URLs
  # from X-Forwarded-Host (including the /office prefix).
  location /office/ {
    proxy_pass http://onlyoffice/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host/office;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  # Meeting recordings arrive as 32 MB chunks; stream them to the app instead
  # of buffering each one in nginx first.
  location /api/meeting-uploads/ {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    client_max_body_size 40m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Online calls: only LiveKit's signaling endpoints (/rtc, /rtc/validate,
  # /rtc/v1…) are reachable; its server API (/twirp) never is.
  location ~ ^/livekit/rtc(/.*)?$ {
    set $livekit_upstream livekit:7880;
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass http://$livekit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  location /livekit/ {
    return 404;
  }
  # LiveKit calls this on the internal network only.
  location = /api/meetings/livekit-webhook {
    return 404;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
